name: Bug
description: Relate um comportamento incorreto e reproduzível.
title: "[Bug] "
labels: [needs-triage]
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução mínima
      description: Não inclua credenciais nem dados financeiros pessoais.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
    validations:
      required: true
