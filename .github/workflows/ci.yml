name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install
        run: uv sync --group dev --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: MyPy
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=marko --cov-report=term-missing --cov-fail-under=80
