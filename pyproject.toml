[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marko"
version = "0.3.2"
description = "Núcleo auditável de um gestor quantitativo pessoal orientado a passivos"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "numpy>=2.0",
  "psycopg[binary]==3.3.4",
  "pyjwt[crypto]==2.13.0",
]

[project.optional-dependencies]
research = [
  "PyPortfolioOpt==1.6.0",
  "skfolio==0.20.2",
]
persistence = [
  "pyarrow==25.0.1",
]
api = [
  "uvicorn==0.52.4",
]

[project.scripts]
marko = "marko.__main__:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marko"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTEXT.md",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "**/.env*",
  "**/.vercel/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/var/private/**",
  "**/data/private/**",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "optional: integração com bibliotecas quantitativas opcionais",
  "persistence: integração com PostgreSQL e Parquet",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["marko"]

[[tool.mypy.overrides]]
module = ["psycopg.*", "pyarrow.*", "pypfopt.*", "skfolio.*"]
ignore_missing_imports = true
