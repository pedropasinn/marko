[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marko"
version = "0.2.1"
description = "Núcleo auditável de um gestor quantitativo pessoal orientado a passivos"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
research = [
  "PyPortfolioOpt==1.6.0",
  "skfolio==0.20.2",
]

[project.scripts]
marko = "marko.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marko"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = ["optional: integração com bibliotecas quantitativas opcionais"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["marko"]

[[tool.mypy.overrides]]
module = ["pypfopt.*", "skfolio.*"]
ignore_missing_imports = true
